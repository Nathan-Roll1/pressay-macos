name: Verify optional Fourier picker on Ubuntu
on:
  push:
    branches: [verify-fourier-linux]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libasound2-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libxkbcommon-dev libdbus-1-dev dbus-daemon xvfb xauth pulseaudio-utils patchelf
      - run: cargo fmt --all --check
      - run: make test
      - run: make app
      - name: Verify an installer from the patched desktop app
        run: |
          find target/release/bundle -type f -name '*.deb' | grep .
